  <!-- Contacto (patrón del template: tarjeta centrada con formulario). El sitio
       es estático y aún no tiene servicio de envío: el botón arma un correo
       con los datos y abre el cliente de correo (js/main.js). Datos de
       contacto verificados; teléfono confirmado para publicar (04-09-2026). -->
  <section class="section">
    <div class="container">
      <article class="card contact-card">
        <div class="card-header">
          <h1 class="card-title">Contacto</h1>
          <p class="card-description">Cuéntanos sobre tu empresa y coordinamos una reunión.</p>
        </div>
        <div class="card-content">
          <form class="form" data-mailto="marcelo.jaramillo@isamingadigital.cl" novalidate>
            <div class="field">
              <label for="nombre">Nombre</label>
              <input class="input" id="nombre" name="nombre" type="text" autocomplete="name" placeholder="Tu nombre">
            </div>
            <div class="field">
              <label for="empresa">Empresa</label>
              <input class="input" id="empresa" name="empresa" type="text" autocomplete="organization" placeholder="Nombre de la empresa">
            </div>
            <div class="field">
              <label for="correo">Correo</label>
              <input class="input" id="correo" name="correo" type="email" autocomplete="email" placeholder="tu@empresa.cl">
            </div>
            <div class="field">
              <label for="mensaje">¿En qué te podemos ayudar?</label>
              <textarea class="textarea" id="mensaje" name="mensaje" placeholder="Cuéntanos brevemente la situación de tu empresa"></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Enviar mensaje</button>
            <p class="form-note">Al enviar se abre tu programa de correo con el mensaje listo para mandar.</p>
          </form>
        </div>
      </article>
    </div>
