<!DOCTYPE html>
<html lang="{{lang}}" class="h-full scroll-smooth bg-white antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="author" content="Isaminga Digital">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="theme-color" content="#2563eb">

  <!-- Favicon derivado del isotipo del logo actual (ver Manual de marca:
       pierde detalle bajo 40 px, se reemplaza cuando exista una version apta) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
  <link rel="apple-touch-icon" href="/img/icon-192.png">

  <!-- Open Graph -->
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{host}}/img/logo.png">
  <meta property="og:locale" content="{{locale}}">
  <meta property="og:site_name" content="Isaminga Digital">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{host}}/img/logo.png">

  <!-- Datos estructurados -->
{{jsonld}}
  <!-- Tipografia del diseno de referencia: Inter para texto y Lexend para
       titulos (font-display), autoalojadas en /fonts (ver src/css/tailwind.css).
       Roboto sigue en evaluacion, ver Tipografia-Isaminga.md -->
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/main.js" defer></script>
</head>
<body class="flex h-full flex-col">
