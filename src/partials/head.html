<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="author" content="Isaminga Digital">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="theme-color" content="#0448A3">

  <!-- Favicon: pendiente producir desde el logo definitivo (ver Manual de marca) -->
  <link rel="icon" type="image/png" href="/img/favicon.png">

  <!-- Open Graph -->
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:locale" content="{{locale}}">
  <meta property="og:site_name" content="Isaminga Digital">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">

  <!-- Datos estructurados -->
{{jsonld}}
  <!-- Tipografia: Inter fija para parrafos. Roboto en evaluacion solo para
       titulos/subtitulos (03-09-2026, sin confirmar). Mientras tanto todo en
       Inter. Ver Tipografia-Isaminga.md -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
