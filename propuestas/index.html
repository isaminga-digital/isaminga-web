<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Propuestas de sitio | Isaminga Digital</title>
  <meta name="description" content="Las tres propuestas de sitio para Isaminga Digital, una encima de otra, con un botón para pasar de una a la siguiente.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../img/favicon.png">

  <!--
    Vista comparada de las propuestas.

    Cada propuesta se sirve entera dentro de su propio documento, en un iframe:
    así ninguna comparte estilos ni scripts con las otras y se ve exactamente
    como se ve sola. El toggle solo cambia cuál se muestra.

    El selector es un interruptor de varias posiciones (tipo píldora con un
    pulsador que se desplaza), en tamaño chico. Esta versión:

    - El ancho de la píldora se calcula desde el número de opciones, en vez de
      estar fijo en 4,5 rem, que solo cuadra con tres.
    - Anillo de foco con focus-visible.
    - No escribe en localStorage hasta que alguien hace clic.
    - La clave de localStorage y el sustantivo de los textos son configuración.
    - Flechas izquierda y derecha, además del clic.
    - Respeta prefers-reduced-motion.

    Para llevarlo a otro proyecto: se copia este archivo, se cambia OPCIONES y
    AJUSTES, y si el efecto no es un iframe se reescribe alMostrar().
  -->

  <style>
    /* Colores del toggle: pista gris translúcida y acento naranja. Para
       vestirlo con la paleta de Isaminga: pista #D6DAE0, activo #0448A3,
       anillo #FE8119. */
    :root {
      --toggle-pista: hsl(0 0% 63.9% / 0.4);
      --toggle-pulsador: #fff;
      --toggle-icono-primero: hsl(0 0% 63.9%);
      --toggle-icono-resto: hsl(25 95% 53%);
      --toggle-anillo: hsl(25 95% 53%);
      --toggle-anillo-fondo: #fff;
      --toggle-etiqueta-fondo: #1F2937;
      --toggle-etiqueta-texto: #fff;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    /* Blanco: es el fondo que pone el navegador cuando una página no define el
       suyo, y un iframe es transparente. */
    body { background: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

    .solo-lectores {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
    }

    .marco { display: block; width: 100%; height: 100%; border: 0; background: #fff; }

    /* La posición es de la página, no del componente: se mueve desde AJUSTES. */
    .zona {
      position: fixed;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 0.625rem;
    }

    /* relative inline-flex items-center rounded-full, alto h-7 del tamaño sm. */
    .toggle {
      position: relative;
      display: inline-flex;
      align-items: center;
      flex: none;
      height: 1.75rem;
      padding: 0;
      border: 0;
      border-radius: 9999px;
      background-color: var(--toggle-pista);
      cursor: pointer;
      transition: background-color 200ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* El ancho lo escribe el script, calculado desde el número de opciones. */

    .toggle:focus { outline: 2px solid transparent; outline-offset: 2px; }
    .toggle:focus-visible {
      outline: 2px solid transparent;
      outline-offset: 2px;
      box-shadow: 0 0 0 2px var(--toggle-anillo-fondo), 0 0 0 4px var(--toggle-anillo);
    }

    /* inline-flex items-center justify-center rounded-full bg-white shadow-sm,
       h-5 w-5 del tamaño sm. */
    .pulsador {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 1.25rem;
      width: 1.25rem;
      border-radius: 9999px;
      background-color: var(--toggle-pulsador);
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .pulsador svg { height: 0.75rem; width: 0.75rem; }

    .etiqueta {
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      background: var(--toggle-etiqueta-fondo);
      color: var(--toggle-etiqueta-texto);
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1.4;
      white-space: nowrap;
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.15);
    }
    /* En pantallas angostas la etiqueta se va: el sitio de abajo importa más. */
    @media (max-width: 480px) { .etiqueta { display: none; } }

    @media (prefers-reduced-motion: reduce) {
      .toggle, .pulsador { transition: none; }
    }
  </style>
</head>
<body>
  <h1 class="solo-lectores">Propuestas de sitio para Isaminga Digital</h1>

  <iframe class="marco" data-marco title="Cargando propuesta"></iframe>

  <div class="zona" data-zona>
    <button type="button" class="toggle" data-boton>
      <span class="pulsador" data-pulsador></span>
    </button>
    <span class="etiqueta" data-etiqueta hidden></span>
  </div>

  <script>
    (function () {
      'use strict'

      /* ------------------------------------------------------------------ *
       * Configuración: esto es lo único que se cambia entre proyectos.      *
       * ------------------------------------------------------------------ */

      // Una entrada por opción, en el orden en que se ciclan. Los iconos son
      // de Lucide (ISC), que es la librería que usa el resto del sitio.
      var OPCIONES = [
        {
          id: 'a-consultor-cercano',
          nombre: 'A · Consultor cercano',
          ruta: 'A-consultor-cercano/index.html',
          icono: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
        },
        {
          id: 'b-corporativo-sobrio',
          nombre: 'B · Corporativo sobrio',
          ruta: 'B-corporativo-sobrio/index.html',
          icono: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>',
        },
        {
          id: 'c-moderno-aspiracional',
          nombre: 'C · Moderno aspiracional',
          ruta: 'C-moderno-aspiracional/index.html',
          icono: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>',
        },
      ]

      var AJUSTES = {
        // Clave de localStorage. Propia de cada proyecto: si dos sitios del
        // mismo dominio usan la misma, se pisan la elección.
        clave: 'isaminga-propuesta',
        // Sustantivo de los textos: "Propuesta A · Consultor cercano".
        sustantivo: 'Propuesta',
        // Etiqueta con el nombre al lado de la píldora.
        etiqueta: true,
        // Dónde se ancla, en CSS. A la izquierda y centrado verticalmente.
        posicion: { left: '1rem', top: '50%', transform: 'translateY(-50%)' },
      }

      /* ------------------------------------------------------------------ *
       * Medidas del tamaño chico del interruptor.                           *
       * ------------------------------------------------------------------ */

      var ALTO = 1.75      // h-7
      var PULSADOR = 1.25  // h-5 w-5
      var MARGEN = 0.25    // translate-x-1 de la primera posición
      var PASO = 1.375     // separación entre posiciones

      // El ancho sale del número de opciones. Con tres da 4,5 rem y con
      // cuatro da 5,875 rem. Así el pulsador nunca se sale.
      var ANCHO = MARGEN * 2 + PULSADOR + PASO * (OPCIONES.length - 1)
      var POSICIONES = OPCIONES.map(function (_, i) { return MARGEN + PASO * i })

      /* ------------------------------------------------------------------ *
       * Qué pasa al mostrar una opción. Acá es cambiar el iframe; si el      *
       * proyecto destino hace otra cosa, se reescribe solo esta función.     *
       * ------------------------------------------------------------------ */

      function alMostrar(opcion, marco) {
        if (marco.getAttribute('src') !== opcion.ruta) marco.setAttribute('src', opcion.ruta)
        marco.title = AJUSTES.sustantivo + ' ' + opcion.nombre
      }

      /* ------------------------------------------------------------------ */

      var marco = document.querySelector('[data-marco]')
      var boton = document.querySelector('[data-boton]')
      var pulsador = document.querySelector('[data-pulsador]')
      var etiqueta = document.querySelector('[data-etiqueta]')
      var zona = document.querySelector('[data-zona]')
      if (!marco || !boton || !pulsador || OPCIONES.length === 0) return

      boton.style.width = ANCHO + 'rem'
      if (zona) for (var prop in AJUSTES.posicion) zona.style[prop] = AJUSTES.posicion[prop]
      if (etiqueta) etiqueta.hidden = !AJUSTES.etiqueta

      // La elección guardada manda; si no hay ninguna, se abre con la primera.
      var indice = 0
      try {
        var guardado = localStorage.getItem(AJUSTES.clave)
        for (var i = 0; i < OPCIONES.length; i++) if (OPCIONES[i].id === guardado) indice = i
      } catch (e) {}

      function aplicar(i, guardar) {
        var opcion = OPCIONES[i]
        var siguiente = OPCIONES[(i + 1) % OPCIONES.length]

        alMostrar(opcion, marco)

        pulsador.style.transform = 'translateX(' + POSICIONES[i] + 'rem)'
        pulsador.style.color = i === 0 ? 'var(--toggle-icono-primero)' : 'var(--toggle-icono-resto)'
        pulsador.innerHTML = opcion.icono

        // title con la opción activa, aria-label con la siguiente.
        boton.setAttribute('title', AJUSTES.sustantivo + ' ' + opcion.nombre)
        boton.setAttribute('aria-label', 'Cambiar a ' + AJUSTES.sustantivo + ' ' + siguiente.nombre)
        if (etiqueta) etiqueta.textContent = opcion.nombre

        // Solo cuando alguien elige: la primera carga no debe dejar rastro.
        if (guardar) {
          try { localStorage.setItem(AJUSTES.clave, opcion.id) } catch (e) {}
        }
      }

      function mover(paso) {
        indice = (indice + paso + OPCIONES.length) % OPCIONES.length
        aplicar(indice, true)
      }

      aplicar(indice, false)

      boton.addEventListener('click', function () { mover(1) })

      // Las flechas mueven en los dos sentidos: comparar es ir y volver.
      boton.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); mover(1) }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); mover(-1) }
      })
    })()
  </script>
</body>
</html>
