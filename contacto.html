  <!-- Datos estructurados -->
  <script type="application/ld+json">

    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",

        "name": "Inicio",

      },
      {

        "position": 2,

  <!-- Tipografia del diseno de referencia: Inter para texto y Lexend para
       titulos (font-display). Roboto sigue en evaluacion, ver Tipografia-Isaminga.md -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@300;400;500&display=swap" rel="stylesheet">

<body class="flex h-full flex-col">

  <div class="relative flex min-h-full shrink-0 justify-center md:px-12 lg:px-0">
    <div class="relative z-10 flex flex-1 flex-col bg-white px-4 py-10 shadow-2xl sm:justify-center md:flex-none md:px-28">

      <main class="mx-auto w-full max-w-md sm:px-4 md:w-96 md:max-w-sm md:px-0">
        <!-- Contacto con el layout angosto (panel blanco + imagen de fondo).
             Datos reales: WhatsApp, oficina, correo. El envío arma un correo
             en el programa del visitante (sitio estático, ver js/main.js). -->
        <div class="flex">
          <a aria-label="Inicio" href="/">
            <img src="/img/logo-horizontal.png" alt="Isaminga Digital" class="h-10 w-auto" width="151" height="40">
          </a>
        </div>
        <h1 class="mt-20 text-lg font-semibold text-gray-900">Hablemos de su empresa</h1>
        <p class="mt-2 text-sm text-gray-700">¿Prefiere WhatsApp? <a class="font-medium text-blue-600 hover:underline" href="https://wa.me/56996471981" target="_blank" rel="noopener">Escríbanos al +56 9 9647 1981</a> y coordinamos una reunión.</p>
        <form class="mt-10 grid grid-cols-1 gap-y-8" action="#" data-mailto="marcelo.jaramillo@isamingadigital.cl">
          <div>
            <label for="nombre" class="mb-3 block text-sm font-medium text-gray-700">Nombre</label>
            <input id="nombre" name="nombre" type="text" autocomplete="name" required class="block w-full appearance-none rounded-md border border-gray-200 bg-gray-50 px-3 py-2 text-gray-900 placeholder-gray-400 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-blue-500 sm:text-sm">
          </div>
          <div>
            <label for="empresa" class="mb-3 block text-sm font-medium text-gray-700">Empresa</label>
            <input id="empresa" name="empresa" type="text" autocomplete="organization" class="block w-full appearance-none rounded-md border border-gray-200 bg-gray-50 px-3 py-2 text-gray-900 placeholder-gray-400 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-blue-500 sm:text-sm">
          </div>
          <div>
            <label for="correo" class="mb-3 block text-sm font-medium text-gray-700">Correo electrónico</label>
            <input id="correo" name="correo" type="email" autocomplete="email" required class="block w-full appearance-none rounded-md border border-gray-200 bg-gray-50 px-3 py-2 text-gray-900 placeholder-gray-400 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-blue-500 sm:text-sm">
          </div>
          <div>
            <label for="mensaje" class="mb-3 block text-sm font-medium text-gray-700">Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="4" required class="block w-full appearance-none rounded-md border border-gray-200 bg-gray-50 px-3 py-2 text-gray-900 placeholder-gray-400 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-blue-500 sm:text-sm"></textarea>
          </div>
          <div>
            <button class="group inline-flex items-center justify-center rounded-full py-2 px-4 text-sm font-semibold focus:outline-none focus-visible:outline-2 focus-visible:outline-offset-2 bg-blue-600 text-white hover:text-slate-100 hover:bg-blue-500 active:bg-blue-800 active:text-blue-100 focus-visible:outline-blue-600 w-full" type="submit">
              <span>Enviar <span aria-hidden="true">&rarr;</span></span>
            </button>
          </div>
        </form>
        <p class="mt-10 text-sm text-gray-700">Oficina en Trizano 250, Temuco. Atención con cita previa.<br><a class="font-medium text-blue-600 hover:underline" href="mailto:marcelo.jaramillo@isamingadigital.cl">marcelo.jaramillo@isamingadigital.cl</a></p>

      </main>
    </div>
    <div class="hidden sm:contents lg:relative lg:block lg:flex-1">
      <img alt="" class="absolute inset-0 h-full w-full object-cover" src="/img/fondo-contacto.jpg" width="1664" height="1866">
    </div>
  </div>
</body>
</html>
